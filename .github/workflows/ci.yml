name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Ensure libGL for headless Compose UI tests (Skiko)
        timeout-minutes: 15
        run: ldconfig -p | grep -q libGL.so.1 || bash tools/ci-apt-install.sh libgl1
      - name: ffmpeg for the real-render tests (LayerFfmpegRenderTest)
        timeout-minutes: 10
        run: bash tools/ci-ffmpeg.sh
      - name: Check (fake providers only, no API keys)
        # AUTOFLOW_EXPECT_FFMPEG: filtergraph tests render with a real ffmpeg and must not skip in CI.
        env: { AUTOFLOW_EXPECT_FFMPEG: "1" }
        # chmod: files pushed via the GitHub API/web UI lose the executable bit.
        run: chmod +x gradlew && ./gradlew :core:check :ai:check :media:check :platform:check :platform:compileAndroidMain :ui:desktopTest :app-desktop:test

  desktop-smoke:
    # D-61: build the packaged desktop app (jpackage app image) and launch it under Xvfb; fail on an error dialog,
    # a missing "Auto Flow" window, an early exit or a startup exception (e.g. "Main dispatcher is missing").
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Package the desktop app (app image)
        run: chmod +x gradlew && ./gradlew :app-desktop:createDistributable
      - name: Launch the packaged app headlessly (smoke test)
        env: { SMOKE_OUT: "${{ runner.temp }}/desktop-smoke" }
        run: bash tools/desktop-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: desktop-smoke, path: "${{ runner.temp }}/desktop-smoke", if-no-files-found: warn }

  windows:
    # D-19: real DPAPI round trip (AUTOFLOW_EXPECT_DPAPI makes the test fail if it is not on Windows), and JvmFs on NTFS.
    # UI tests on Windows too: a system font must cover Myanmar, and screenshots are uploaded for review.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: ":platform tests on Windows (fakes only, no secrets)"
        env: { AUTOFLOW_EXPECT_DPAPI: "1" }
        run: ./gradlew :platform:desktopTest
      - name: ":ui tests on Windows (Myanmar font fallback, screenshots)"
        env: { AUTOFLOW_EXPECT_MYANMAR_FONT: "1", AUTOFLOW_SCREENSHOTS_DIR: "${{ github.workspace }}/ui/build/screenshots" }
        run: ./gradlew :ui:desktopTest
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-screenshots, path: ui/build/screenshots, if-no-files-found: warn }
      - uses: actions/upload-artifact@v4
        # Test reports for diagnosis: job logs are not readable without a login.
        if: failure()
        with: { name: windows-test-results, path: "*/build/test-results/**/*.xml", if-no-files-found: warn }
      - name: Failed tests as annotations (logs and artifacts need a login; annotations do not)
        if: failure()
        run: |
          python - <<'PY'
          import glob, xml.etree.ElementTree as ET
          shown = 0
          for path in sorted(glob.glob("*/build/test-results/**/*.xml", recursive=True)):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for bad in case.findall("failure") + case.findall("error"):
                      text = (bad.get("message") or bad.text or "").replace("\r", "")[:2500]
                      text = text.replace("%", "%25").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
                      shown += 1
                      if shown >= 10:
                          raise SystemExit(0)
          PY

  windows-installer:
    # Q-01 / D-65 / D-66: the real Windows EXE installer (jpackage + WiX on Windows; it cannot be cross-built), then
    # install -> launch the INSTALLED app -> close -> uninstall on this disposable runner (tools/windows-installer-smoke.ps1).
    # Unsigned and labelled so; an Actions artifact only, never a release. The SHA-256 is also printed as an annotation
    # because artifact downloads need a GitHub login.
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
      WIX_SHA256: 6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v6
      - name: WiX Toolset v3.14.1 (pinned SHA-256; Compose uses it through WIX_PATH)
        shell: pwsh
        run: |
          # The runner context is not available in job-level env, so the output folders are exported from here.
          $env:SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'installer-smoke'; $env:DIST_DIR = Join-Path $env:RUNNER_TEMP 'exe'
          New-Item -ItemType Directory -Force $env:SMOKE_DIR, $env:DIST_DIR | Out-Null
          "SMOKE_DIR=$env:SMOKE_DIR", "DIST_DIR=$env:DIST_DIR" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          Invoke-WebRequest -Uri $env:WIX_URL -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h -ne $env:WIX_SHA256) { throw "WiX download SHA-256 $h does not match the pinned $env:WIX_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP 'wix314'
          Expand-Archive $zip -DestinationPath $dir
          "WIX_PATH=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $out = Join-Path $env:SMOKE_DIR 'toolchain.txt'
          "wix candle.exe $((Get-Item (Join-Path $dir 'candle.exe')).VersionInfo.FileVersion), light.exe $((Get-Item (Join-Path $dir 'light.exe')).VersionInfo.FileVersion), zip sha256 $h" | Out-File -Encoding utf8 $out
          & java -version 2>&1 | Out-File -Append -Encoding utf8 $out
          & javac -version 2>&1 | Out-File -Append -Encoding utf8 $out
          "jpackage $(& jpackage --version)" | Out-File -Append -Encoding utf8 $out
          "jmods/java.base.jmod present: $(Test-Path (Join-Path $env:JAVA_HOME 'jmods\java.base.jmod'))" | Out-File -Append -Encoding utf8 $out
          "runner: $env:ImageOS $env:ImageVersion" | Out-File -Append -Encoding utf8 $out
          Get-Content $out
      - name: Build the EXE installer (:app-desktop:packageExe)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app-desktop:packageExe -Pcompose.desktop.verbose=true 2>&1 | tee "$SMOKE_DIR/package-exe.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Label the unsigned EXE, SHA-256 and manifest
        shell: pwsh
        run: |
          $built = @(Get-ChildItem app-desktop/build/compose/binaries/main/exe -Filter *.exe)
          if ($built.Count -ne 1) { throw "expected exactly one EXE, found $($built.Count)" }
          if ($built[0].Name -notmatch '^AutoFlow-(\d+\.\d+\.\d+)\.exe$') { throw "unexpected EXE name $($built[0].Name)" }
          $version = $Matches[1]
          $name = "AutoFlow-$version-$($env:GITHUB_SHA.Substring(0, 7))-unsigned-setup.exe"
          $exe = Join-Path $env:DIST_DIR $name
          Copy-Item $built[0].FullName $exe
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha *$name" | Out-File -Encoding ascii -NoNewline "$exe.sha256"
          @("Auto Flow $version Windows installer - UNSIGNED test build (Windows SmartScreen will warn). Not a release.",
            "file: $name", "bytes: $((Get-Item $exe).Length)", "sha256: $sha", "source commit: $env:GITHUB_SHA",
            "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "install: per-user (no admin), %LOCALAPPDATA%\AutoFlow; uninstall from Settings > Apps; user data in %USERPROFILE%\.autoflow is kept.",
            "", "toolchain:") + (Get-Content (Join-Path $env:SMOKE_DIR 'toolchain.txt')) | Out-File -Encoding utf8 (Join-Path $env:DIST_DIR 'MANIFEST.txt')
          "EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "EXE_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "EXE_ARTIFACT=autoflow-windows-exe-unsigned-$($env:GITHUB_SHA.Substring(0, 7))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Output "::notice title=Windows EXE (unsigned) SHA-256::$sha  $name"
      - name: Install -> launch the installed app -> uninstall (disposable runner only)
        shell: pwsh
        env: { AUTOFLOW_DISPOSABLE_RUNNER: "1" }
        run: pwsh -NoProfile -File tools/windows-installer-smoke.ps1 -Exe $env:EXE -OutDir $env:SMOKE_DIR -ExpectedVersion $env:EXE_VERSION
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-installer-smoke, path: "${{ env.SMOKE_DIR }}", if-no-files-found: warn }
      - uses: actions/upload-artifact@v4
        # Only an EXE that passed the install/launch/uninstall check is offered for download.
        with: { name: "${{ env.EXE_ARTIFACT }}", path: "${{ env.DIST_DIR }}", if-no-files-found: error }

  android:
    # D-24: every push builds a debug APK (Actions artifact); a v0.* tag, or a change to .github/release-tag.txt on main,
    # also publishes it as a GitHub Release so the owner can install it from the phone.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key from secrets (stable across builds; never committed)
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/autoflow.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/autoflow.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: the APK is signed with this runner's debug key and will not install over a previous build"
          fi
      - name: Android unit tests (render queue/worker with fakes, D-26)
        run: chmod +x gradlew && ./gradlew :app-android:testDebugUnitTest
      - name: ffmpeg for Android (D-23) — restore the cached build
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with: { path: build/ffmpeg-android/out, key: "ffmpeg-android-${{ hashFiles('tools/ffmpeg-android/**') }}" }
      - name: ffmpeg for Android — build from pinned sources (cache miss only, ~25 min)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          source tools/ffmpeg-android/versions.sh
          pipx install meson > /dev/null && pipx install ninja > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bash tools/ffmpeg-android/build.sh 2>&1 | tee "$RUNNER_TEMP/ffmpeg.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: ffmpeg for Android — save the build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: build/ffmpeg-android/out, key: "ffmpeg-android-${{ hashFiles('tools/ffmpeg-android/**') }}" }
      - name: Bundle ffmpeg into the APK
        run: |
          mkdir -p app-android/src/main/jniLibs/arm64-v8a app-android/build/generated/bundled/ffmpeg
          cp build/ffmpeg-android/out/lib*.so app-android/src/main/jniLibs/arm64-v8a/
          cp -r build/ffmpeg-android/out/BUILDINFO.txt build/ffmpeg-android/out/licenses app-android/build/generated/bundled/ffmpeg/
          cat build/ffmpeg-android/out/BUILDINFO.txt
          echo "::notice title=Bundled ffmpeg::$(grep -E '^lib' build/ffmpeg-android/out/BUILDINFO.txt | tr '\n' ' ')"
      - name: Self-test media (PLAN S6) — generated, not committed
        timeout-minutes: 15
        run: |
          bash tools/ci-ffmpeg.sh
          export PATH="$RUNNER_TEMP/ffmpeg-static:$PATH"
          bash tools/selftest-fixtures.sh app-android/build/generated/bundled
      - name: Assemble debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: |
          chmod +x gradlew
          ./gradlew :app-android:assembleDebug -PversionCode=${{ github.run_number }} -PgitSha=${GITHUB_SHA::7} 2>&1 | tee "$RUNNER_TEMP/apk.log"
          test "${PIPESTATUS[0]}" -eq 0
          APK="autoflow-debug-${GITHUB_SHA::7}.apk"
          cp app-android/build/outputs/apk/debug/app-android-debug.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -l "$APK"
          # The artifact zip digest is not the APK's hash: publish the APK's own SHA-256 (artifact downloads need a login).
          mkdir -p apk-dist && cp "$APK" apk-dist/ && (cd apk-dist && sha256sum "$APK" > "$APK.sha256")
          echo "::notice title=Debug APK SHA-256::$(cat "apk-dist/$APK.sha256") (source $GITHUB_SHA)"
      - name: Show the build error as an annotation
        if: failure()
        run: |
          for f in ffmpeg apk; do
            [ -f "$RUNNER_TEMP/$f.log" ] || continue
            tail -n 80 "$RUNNER_TEMP/$f.log" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed "s/^/::error title=$f log::/"; echo
          done
      - uses: actions/upload-artifact@v4
        with: { name: "${{ env.APK }}", path: apk-dist, if-no-files-found: error }
      - name: GitHub Release (tag v0.* or .github/release-tag.txt on main)
        if: startsWith(github.ref, 'refs/tags/v0.') || github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif git diff --name-only HEAD~1 HEAD | grep -qx .github/release-tag.txt; then
            TAG="$(tr -d '[:space:]' < .github/release-tag.txt)"
          else
            echo "No release requested"; exit 0
          fi
          [[ "$TAG" == v0.* ]] || { echo "::error::.github/release-tag.txt must hold a v0.* tag, got '$TAG'"; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Auto Flow $TAG" --notes-file .github/release-notes.md
          fi
