name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Ensure libGL for headless Compose UI tests (Skiko)
        timeout-minutes: 15
        run: ldconfig -p | grep -q libGL.so.1 || bash tools/ci-apt-install.sh libgl1
      - name: Check (fake providers only, no API keys)
        # chmod: files pushed via the GitHub API/web UI lose the executable bit.
        run: chmod +x gradlew && ./gradlew :core:check :ai:check :media:check :platform:check :platform:compileAndroidMain :ui:desktopTest :app-desktop:test

  windows:
    # D-19: real DPAPI round trip (AUTOFLOW_EXPECT_DPAPI makes the test fail if it is not on Windows), and JvmFs on NTFS.
    # UI tests on Windows too: a system font must cover Myanmar, and screenshots are uploaded for review.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: ":platform tests on Windows (fakes only, no secrets)"
        env: { AUTOFLOW_EXPECT_DPAPI: "1" }
        run: ./gradlew :platform:desktopTest
      - name: ":ui tests on Windows (Myanmar font fallback, screenshots)"
        env: { AUTOFLOW_EXPECT_MYANMAR_FONT: "1", AUTOFLOW_SCREENSHOTS_DIR: "${{ github.workspace }}/ui/build/screenshots" }
        run: ./gradlew :ui:desktopTest
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-screenshots, path: ui/build/screenshots, if-no-files-found: warn }

  android:
    # D-24: every push builds a debug APK (Actions artifact); a v0.* tag, or a change to .github/release-tag.txt on main,
    # also publishes it as a GitHub Release so the owner can install it from the phone.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing key from secrets (stable across builds; never committed)
        env: { KEYSTORE_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/autoflow.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/autoflow.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set: the APK is signed with this runner's debug key and will not install over a previous build"
          fi
      - name: Android unit tests (render queue/worker with fakes, D-26)
        run: chmod +x gradlew && ./gradlew :app-android:testDebugUnitTest
      - name: ffmpeg for Android (D-23) — restore the cached build
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with: { path: build/ffmpeg-android/out, key: "ffmpeg-android-${{ hashFiles('tools/ffmpeg-android/**') }}" }
      - name: ffmpeg for Android — build from pinned sources (cache miss only, ~25 min)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          source tools/ffmpeg-android/versions.sh
          pipx install meson > /dev/null && pipx install ninja > /dev/null
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" bash tools/ffmpeg-android/build.sh 2>&1 | tee "$RUNNER_TEMP/ffmpeg.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: ffmpeg for Android — save the build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with: { path: build/ffmpeg-android/out, key: "ffmpeg-android-${{ hashFiles('tools/ffmpeg-android/**') }}" }
      - name: Bundle ffmpeg into the APK
        run: |
          mkdir -p app-android/src/main/jniLibs/arm64-v8a app-android/build/generated/bundled/ffmpeg
          cp build/ffmpeg-android/out/lib*.so app-android/src/main/jniLibs/arm64-v8a/
          cp -r build/ffmpeg-android/out/BUILDINFO.txt build/ffmpeg-android/out/licenses app-android/build/generated/bundled/ffmpeg/
          cat build/ffmpeg-android/out/BUILDINFO.txt
          echo "::notice title=Bundled ffmpeg::$(grep -E '^lib' build/ffmpeg-android/out/BUILDINFO.txt | tr '\n' ' ')"
      - name: Self-test media (PLAN S6) — generated, not committed
        timeout-minutes: 15
        run: |
          bash tools/ci-apt-install.sh ffmpeg
          bash tools/selftest-fixtures.sh app-android/build/generated/bundled
      - name: Assemble debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          ANDROID_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          ANDROID_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: |
          chmod +x gradlew
          ./gradlew :app-android:assembleDebug -PversionCode=${{ github.run_number }} -PgitSha=${GITHUB_SHA::7} 2>&1 | tee "$RUNNER_TEMP/apk.log"
          test "${PIPESTATUS[0]}" -eq 0
          APK="autoflow-debug-${GITHUB_SHA::7}.apk"
          cp app-android/build/outputs/apk/debug/app-android-debug.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -l "$APK"
      - name: Show the build error as an annotation
        if: failure()
        run: |
          for f in ffmpeg apk; do
            [ -f "$RUNNER_TEMP/$f.log" ] || continue
            tail -n 80 "$RUNNER_TEMP/$f.log" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed "s/^/::error title=$f log::/"; echo
          done
      - uses: actions/upload-artifact@v4
        with: { name: "${{ env.APK }}", path: "${{ env.APK }}", if-no-files-found: error }
      - name: GitHub Release (tag v0.* or .github/release-tag.txt on main)
        if: startsWith(github.ref, 'refs/tags/v0.') || github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v0.* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif git diff --name-only HEAD~1 HEAD | grep -qx .github/release-tag.txt; then
            TAG="$(tr -d '[:space:]' < .github/release-tag.txt)"
          else
            echo "No release requested"; exit 0
          fi
          [[ "$TAG" == v0.* ]] || { echo "::error::.github/release-tag.txt must hold a v0.* tag, got '$TAG'"; exit 1; }
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Auto Flow $TAG" --notes-file .github/release-notes.md
          fi
