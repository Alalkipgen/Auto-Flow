# One-off S1/S2 live spike. Uses temporary secret GEMINI_API_KEY_SPIKE; delete the secret after the run.
# Normal CI (ci.yml) stays on fake providers only.
name: Spike Gemini (S1/S2)

on:
  push:
    branches: [work/phase-0-spikes]
    paths: [spikes/gemini-run.txt]

permissions:
  contents: write

concurrency: spike-gemini

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: S1 text storyboard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_SPIKE }}
        run: chmod +x gradlew && ./gradlew -q -p spikes/s1-gemini-text run 2>&1 | tee spikes/s1-gemini-text/results-run.log || true
      - name: S2 image
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_SPIKE }}
        run: ./gradlew -q -p spikes/s2-gemini-image run 2>&1 | tee spikes/s2-gemini-image/results-run.log || true
      - name: Commit raw results (no key is written to these files)
        run: |
          if [ -n "$KEY" ] && grep -rqF -- "$KEY" spikes/s1-gemini-text spikes/s2-gemini-image; then echo "key found in output; aborting"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f spikes/s1-gemini-text/results spikes/s1-gemini-text/results-run.log spikes/s2-gemini-image/results spikes/s2-gemini-image/results-run.log || true
          git commit -m "phase0(spikes): S1/S2 live results [skip ci]" && git push || echo "nothing to commit"
        env:
          KEY: ${{ secrets.GEMINI_API_KEY_SPIKE }}
